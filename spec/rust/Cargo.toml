# Hand-written crate manifest, which lives outside the *.g.rs codegen glob (like
# spec/go/go.mod for the Go backend). Edit by hand; the *.g.rs sources are
# regenerated by `dotnet run --project codegen/src/Packet.Sdl.CodeGen -- --rust`.
#
# The crate is `no_std`-capable: the core data tables + types touch no
# allocator, so an embedded consumer (e.g. a Pi Pico W AX.25 node) depends on
# it with `default-features = false`. The default-on `std` feature lights up
# the generated test harness (host `cargo test`); a `--no-default-features`
# build is `#![no_std]`.
#
# MAJOR.MINOR tracks the WG-published spec revision (2.2); PATCH is the errata
# batch accumulation; see CLAUDE.md "Package versioning". This crate has its own
# release line, decoupled from the npm/nuget `v*` tags: it publishes to crates.io
# from a `crate-v*` tag (.github/workflows/publish-crate.yml), and the published
# version is taken from that tag. Keep this field in sync with the tag you push.
#
# 0.9.0 adds the `vr_lt_ns_lt_vr_plus_k` member to the Ax25Guard closed set
# (packethacking/ax25spec#40, the X.25 2.4.6.4(a) out-of-window duplicate-discard
# guard on figc4.4/figc4.5). A new enum variant breaks exhaustive matches in
# consumers, which is the intended signal: pico-node must bind the atom before
# it compiles again.
#
# 0.8.0 was the first published version: it signalled the breaking shape change from
# ADR-0003 (typed closed sets on ActionStep.verb / TransitionSpec.on+guard /
# SubroutinePath.guard / LoopRange.predicate); pre-1.0 SemVer treats a minor
# bump as the breaking signal.
[package]
name = "ax25sdl"
version = "0.9.0"
edition = "2021"
rust-version = "1.70"
description = "Generated AX.25 v2.2 SDL state-machine tables (figc4.x) as no_std-capable Rust data."
license = "AGPL-3.0-or-later"
repository = "https://github.com/packet-net/ax25sdl"
homepage = "https://github.com/packet-net/ax25sdl"
documentation = "https://docs.rs/ax25sdl"
readme = "README.md"
keywords = ["ax25", "ham-radio", "sdl", "packet-radio", "no_std"]
categories = ["no-std", "embedded", "network-programming", "parsing"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
# `std` is on by default so host `cargo test` / `cargo build` Just Work. An
# embedded consumer opts out with `default-features = false`, which flips the
# crate to `#![no_std]` (see the cfg_attr in src/lib.rs). The feature gates no
# API surface today (the entire data/type core is no_std-clean), it only
# selects whether `std` is linked, which the test harness requires.
default = ["std"]
std = []

[lib]
path = "src/lib.rs"
