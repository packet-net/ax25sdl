name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # GitHub will force JavaScript actions onto Node.js 24 from
  # June 2nd, 2026. Opting in early matches m0lte/packet.net.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Build + test the C# codegen + Sdl package ─────────────────────
  csharp:
    name: C# build + test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      - name: dotnet --version
        run: dotnet --version
      - name: build
        run: dotnet build codegen/ax25sdl.slnx --nologo
      - name: test
        run: dotnet test codegen/ax25sdl.slnx --nologo --no-build

  # ─── Codegen drift: regen each backend, error if the committed
  #     generated files don't match the freshly-generated output. ───
  csharp-drift:
    name: codegen drift — C#
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      - name: regenerate C#
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --csharp
      - name: assert no diff
        run: |
          if ! git diff --exit-code -- spec/csharp/; then
            echo "::error::Generated C# files in spec/csharp/ are out of sync with the SDL YAML. Run \`dotnet run --project codegen/src/Packet.Sdl.CodeGen -- --csharp\` locally and commit the diff."
            exit 1
          fi

  ts-drift:
    name: codegen drift — TS + typecheck/test
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spec/ts/package-lock.json
      - name: regenerate TS
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --ts
      - name: assert no diff
        run: |
          if ! git diff --exit-code -- spec/ts/; then
            echo "::error::Generated TS files in spec/ts/ are out of sync. Run \`dotnet run --project codegen/src/Packet.Sdl.CodeGen -- --ts\` locally and commit the diff."
            exit 1
          fi
      - name: spec/ts — install
        working-directory: spec/ts
        run: npm ci
      - name: spec/ts — typecheck
        working-directory: spec/ts
        run: npm run typecheck
      - name: spec/ts — test
        working-directory: spec/ts
        run: npm test
      - name: spec/ts — build
        working-directory: spec/ts
        run: npm run build

  go-drift:
    name: codegen drift — Go + build/vet/test/gofmt
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          # No external Go deps → no go.sum → caching would warn on every run.
          cache: false
      - name: regenerate Go
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --go
      - name: assert no diff
        run: |
          if ! git diff --exit-code -- spec/go/; then
            echo "::error::Generated Go files in spec/go/ are out of sync. Run \`dotnet run --project codegen/src/Packet.Sdl.CodeGen -- --go\` locally and commit the diff."
            exit 1
          fi
      - name: go build
        working-directory: spec/go
        run: go build ./...
      - name: go vet
        working-directory: spec/go
        run: go vet ./...
      - name: go test
        working-directory: spec/go
        run: go test ./...
      - name: gofmt
        working-directory: spec/go
        run: |
          mismatched=$(gofmt -l .)
          if [ -n "$mismatched" ]; then
            echo "::error::gofmt finds files needing reformatting:"
            echo "$mismatched"
            exit 1
          fi

  json-drift:
    name: codegen drift — JSON + schema validation
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      - name: regenerate JSON
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --json
      - name: assert no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated JSON files are out of sync."
            exit 1
          fi

  # ─── Semantic validation: golden traces vs the regenerated JSON
  #     tables. The reference interpreter (Packet.Sdl.Interpreter)
  #     executes spec/json directly; traces/*.trace.yaml assert the
  #     prose-derived behaviour, with expected_failure entries running
  #     as strict xfails against catalogued upstream figure defects. ───
  semantic-traces:
    name: semantic validation — golden traces
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule; the regenerate step reads the SDL sources.
          submodules: true
      - name: regenerate JSON
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --json
      - name: run golden-trace suite against the regenerated tables
        run: dotnet test codegen/tests/Packet.Sdl.Interpreter.Tests --nologo

  rust-drift:
    name: codegen drift — Rust + cargo build/test/fmt
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      # rustfmt disappeared from the runner around 2026-06-14 (job red on
      # main since 0a47223): the codegen emitter warns-and-continues without
      # it, emitting non-canonically-formatted output that fails the drift
      # check with a misleading 9-file diff. Re-add the rustup toolchain dir,
      # self-heal via rustup where possible, and otherwise fail fast with an
      # actionable message.
      - name: ensure rustfmt on PATH
        run: |
          [ -d "$HOME/.cargo/bin" ] && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # NB: test that rustfmt RUNS, not merely that it is on PATH. rustup
          # installs a shim at ~/.cargo/bin/rustfmt that exists even when the
          # rustfmt component is not installed for the active toolchain, so
          # `command -v rustfmt` is a false positive and this self-heal never
          # fired. That is why this job stayed red from 2026-06-14.
          if ! rustfmt --version >/dev/null 2>&1; then
            if command -v rustup >/dev/null 2>&1; then
              rustup component add rustfmt
            else
              echo "::error::rustfmt is unavailable and rustup is not installed on this runner. Install the Rust toolchain (with the rustfmt component) on the runner; this job has been red on main since 2026-06-14 because of it."
              exit 1
            fi
          fi
          rustfmt --version
      - name: regenerate Rust
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --rust
      - name: assert no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated Rust files are out of sync. Run \`dotnet run --project codegen/src/Packet.Sdl.CodeGen -- --rust\` locally and commit the diff."
            exit 1
          fi
      - name: cargo fmt --check
        working-directory: spec/rust
        run: cargo fmt --check
      - name: cargo build
        working-directory: spec/rust
        run: cargo build
      - name: cargo build --no-default-features (no_std)
        working-directory: spec/rust
        run: cargo build --no-default-features
      - name: cargo test
        working-directory: spec/rust
        run: cargo test

  c-drift:
    name: codegen drift — C + cmake build/ctest/clang-format
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      # Not every self-hosted runner has a system clang-format (the emitter
      # warns-and-continues without it, emitting non-canonically-formatted C
      # that fails the drift check). Self-heal with a pinned pip venv —
      # 22.1.5 matches the formatting of the committed spec/c corpus.
      - name: ensure clang-format on PATH
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            python3 -m venv "$RUNNER_TEMP/clang-format-venv"
            "$RUNNER_TEMP/clang-format-venv/bin/pip" install --quiet clang-format==22.1.5
            echo "$RUNNER_TEMP/clang-format-venv/bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/clang-format-venv/bin:$PATH"
          fi
          clang-format --version
      - name: regenerate C
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --c
      - name: assert no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated C files are out of sync. Run \`dotnet run --project codegen/src/Packet.Sdl.CodeGen -- --c\` locally and commit the diff."
            exit 1
          fi
      - name: cmake build + ctest
        working-directory: spec/c
        run: |
          cmake -B build -S .
          cmake --build build
          ctest --test-dir build --output-on-failure

  python-drift:
    name: codegen drift — Python + pytest/ruff
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      - name: regenerate Python
        run: dotnet run --project codegen/src/Packet.Sdl.CodeGen --configuration Release -- --python
      - name: assert no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated Python files are out of sync. Run \`dotnet run --project codegen/src/Packet.Sdl.CodeGen -- --python\` locally and commit the diff."
            exit 1
          fi
      - name: pytest + ruff
        working-directory: spec/python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          # Pinned for the same reason clang-format is pinned above: an unpinned
          # linter makes CI depend on whatever version happens to publish, and a
          # widened default rule set turned this job red on an untouched repo.
          .venv/bin/pip install --quiet pytest==9.1.1 ruff==0.16.4
          .venv/bin/ruff check .
          .venv/bin/pytest -q --import-mode=importlib

  transcribe-drift:
    name: transcribe drift — graphml → yaml (submodule)
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    # The SDL sources live in the packethacking/ax25spec submodule
    # (spec-sdl -> ax25spec/spec-sdl). Validate — READ-ONLY against the
    # pinned submodule commit — that the *.sdl.yaml committed there match
    # what THIS repo's Packet.Sdl.Transcribe walker produces from the
    # *.graphml sources there. Regeneration goes to a temp dir; nothing
    # writes into the submodule. A failure means the walker's behaviour
    # has drifted from the transcriptions at the pin: fix the walker, or
    # land the regenerated yaml in ax25spec and bump the pin — never edit
    # the submodule contents from this repo.
    # (render drift — graphml → SVG — moved to ax25spec's CI along with
    # tools/render/; the yaml → code drift jobs above stay here.)
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule — every job that reads the SDL sources needs it.
          submodules: true
      - name: regenerate yaml from graphml (out-of-tree)
        run: |
          out="$RUNNER_TEMP/transcribe-out"
          rm -rf "$out" && mkdir -p "$out"
          # The walker preserves out-of-band annotations (notes,
          # references, pinned_refs) by reading any pre-existing yaml at
          # the output path — seed the temp dir with the committed yaml
          # to mirror the in-place regeneration it was designed for.
          cp spec-sdl/v2.2-errata/data-link/yaml/*.sdl.yaml "$out/"
          dotnet run --project codegen/src/Packet.Sdl.Transcribe --configuration Release -- \
            -i spec-sdl/v2.2-errata/data-link/sdl/ \
            -o "$out/"
      - name: assert no diff vs the pinned submodule
        run: |
          if ! diff -ru --exclude='*.citations.yaml' \
              spec-sdl/v2.2-errata/data-link/yaml/ "$RUNNER_TEMP/transcribe-out/"; then
            echo "::error::*.sdl.yaml in the ax25spec submodule are out of sync with what this walker produces from their *.graphml sources. Either the walker changed behaviour (fix it or regenerate in packethacking/ax25spec and bump the submodule pin) or the pin points at an internally-inconsistent ax25spec commit (its own transcribe-drift CI should be red)."
            exit 1
          fi

  # ─── Semantic validation: the two-station explorer's calibration
  #     suite. Composes two reference-interpreter machines over a modelled
  #     lossy channel and must rediscover the catalogued figure defects on
  #     the pre-fix fixture tables (and stay silent where the fix landed).
  #     See docs/explorer.md. ───
  semantic-explorer:
    name: semantic validation - two-station explorer
    runs-on: [self-hosted, Linux, X64]
    needs: csharp
    steps:
      - uses: actions/checkout@v6
        with:
          # spec-sdl is a symlink into the packethacking/ax25spec
          # submodule; the suite locates the repo root through it.
          submodules: true
      - name: run the explorer calibration suite
        run: dotnet test codegen/tests/Packet.Sdl.Explorer.Tests --nologo
