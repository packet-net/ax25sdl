name: tla-independent

# The independent meaning (ax25spec#116 Phase 2, Step C): the default meaning
# and spec/tla/Ax25MeaningIndependent.tla in lockstep on every calibration row,
# then the plain cross-check (explorer against TLC) on the independent meaning.
# Informational: the differences are the product
# (docs/tla-independent/differences.md), so both steps may fail without failing
# the job; the reports are in the job summary and the uploaded artifact. About
# an hour on a self-hosted runner, so it runs only when what it checks changes,
# weekly, and on demand. Its own workflow because GitHub has no job-level path
# filter.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'spec/tla/**'
      - 'codegen/src/Packet.Sdl.TlaCheck/**'
      - 'ax25spec'
      - '.github/workflows/tla-independent.yml'
  pull_request:
    paths:
      - 'spec/tla/**'
      - 'codegen/src/Packet.Sdl.TlaCheck/**'
      - 'ax25spec'
      - '.github/workflows/tla-independent.yml'

concurrency:
  group: tla-independent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semantic-tla-independent:
    name: semantic validation - TLA+ independent meaning (informational)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch tla2tools.jar (TLC 2.19, tlaplus v1.7.4)
        run: |
          set -euo pipefail
          TLA_VERSION=1.7.4
          TLA_SHA256=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$jar" "https://github.com/tlaplus/tlaplus/releases/download/v$TLA_VERSION/tla2tools.jar"
          if ! echo "$TLA_SHA256  $jar" | sha256sum -c -; then
            echo "::error::tla2tools.jar v$TLA_VERSION SHA-256 does not match the pinned checksum"
            exit 1
          fi
          echo "TLA2TOOLS_JAR=$jar" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/reports"
      - name: build TlaCheck
        run: dotnet build codegen/src/Packet.Sdl.TlaCheck --configuration Release --nologo -v q
      # Up to 8 runs per row: each run sets the differences already found aside
      # and looks for the next one.
      - name: lockstep, Ax25Meaning against Ax25MeaningIndependent
        continue-on-error: true
        run: |
          set -euo pipefail
          cores=$(nproc)
          parallel=$(( cores >= 8 ? 4 : 2 ))
          dotnet run --no-build --project codegen/src/Packet.Sdl.TlaCheck --configuration Release -- --jar "$TLA2TOOLS_JAR" --parallel "$parallel" --heap 1g \
            --work "$RUNNER_TEMP/tla-lockstep" --timeout 300 --lockstep --meaning Ax25MeaningIndependent --lockstep-iterate 8 | tee "$RUNNER_TEMP/reports/lockstep.md"
      - name: cross-check, explorer against TLC on Ax25MeaningIndependent
        continue-on-error: true
        run: |
          set -euo pipefail
          cores=$(nproc)
          parallel=$(( cores >= 8 ? 4 : 2 ))
          dotnet run --no-build --project codegen/src/Packet.Sdl.TlaCheck --configuration Release -- --jar "$TLA2TOOLS_JAR" --parallel "$parallel" --heap 1g \
            --work "$RUNNER_TEMP/tla-independent" --meaning Ax25MeaningIndependent | tee "$RUNNER_TEMP/reports/cross-check-independent.md"
      - name: job summary
        if: always()
        run: |
          cat "$RUNNER_TEMP"/reports/*.md >> "$GITHUB_STEP_SUMMARY" || true
          rm -rf "$RUNNER_TEMP/tla-lockstep" "$RUNNER_TEMP/tla-independent"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tla-independent-reports
          path: ${{ runner.temp }}/reports
