name: publish

# Publishes `ax25sdl` (from spec/ts/) to npmjs.com and
# `Packet.Ax25.Sdl` (from spec/csharp/) to nuget.org on any
# tag matching `v*`. Version is taken from the tag (strip the leading
# `v`), so e.g. tagging `v0.3.0` publishes both at 0.3.0.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual trigger lets you validate the workflow shape from a branch.
    # NOTE that npm now publishes via trusted publishing, which has no secret
    # to leave unset, so a dispatch run WILL attempt a real npm upload. The
    # NuGet leg still skips when NUGET_API_KEY is absent.
    inputs:
      override_version:
        description: 'Override version (only used for workflow_dispatch; tag wins for push events)'
        required: false
        default: ''

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    name: resolve version from tag
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # github.ref is refs/tags/v0.3.0 — strip prefix + leading v.
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          else
            version="${{ inputs.override_version }}"
          fi
          if [ -z "$version" ]; then
            echo "::error::No version resolved (tag was '${GITHUB_REF}', input was empty)."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${version}"

  # ─── npm: ax25sdl ────────────────────────────────────────────────────
  publish-npm:
    name: publish ax25sdl to npmjs.com
    needs: resolve-version
    # DELIBERATE EXCEPTION to this repo's self-hosted-only rule, and the only
    # one. npm REFUSES a provenance attestation built anywhere else:
    # "Unsupported GitHub Actions runner environment: self-hosted. Only
    # github-hosted runners are supported when publishing with provenance"
    # (E422 on PUT, seen on the first 0.11.0 attempt). Trusted publishing
    # generates provenance by default, so the choice is a hosted runner or no
    # attestation, and a signed link from tarball to commit is worth more than
    # the couple of minutes this small job costs. Every other job in this repo
    # stays on [self-hosted, Linux, X64]; this is not a precedent for the
    # drift/build jobs, which are the ones that would actually burn minutes.
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC), configured at the npmjs end against
    # packet-net/ax25sdl + this workflow file. The runner mints a short-lived
    # id-token instead of presenting a long-lived NPM_TOKEN, so there is no
    # npm secret to expire; `id-token: write` is what lets it do that, and it
    # is also what makes npm attach a provenance attestation to the release.
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: ensure an npm that speaks trusted publishing
        # Trusted publishing needs npm >= 11.5.1. Whatever npm ships with the
        # node above, pin the CLI forward explicitly rather than inheriting it.
        run: |
          npm install -g npm@latest
          npm --version

      - name: spec/ts — pin version from tag
        working-directory: spec/ts
        run: |
          echo "Pinning spec/ts/package.json → ${VERSION}"
          npm pkg set "version=${VERSION}"

      - name: spec/ts — install + build
        working-directory: spec/ts
        run: |
          npm install
          npm run build

      - name: spec/ts — pack (dry-run sanity check)
        working-directory: spec/ts
        run: npm pack --dry-run

      - name: spec/ts — publish
        working-directory: spec/ts
        run: npm publish --access public

  # ─── NuGet: Packet.Ax25.Sdl ─────────────────────────────────────────
  publish-nuget:
    name: publish Packet.Ax25.Sdl to nuget.org
    needs: resolve-version
    runs-on: [self-hosted, Linux, X64]
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: dotnet --version
        run: dotnet --version

      - name: build
        run: dotnet build spec/csharp/Packet.Ax25.Sdl.csproj --configuration Release -p:Version=${{ env.VERSION }}

      - name: pack
        run: |
          dotnet pack spec/csharp/Packet.Ax25.Sdl.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts \
            -p:Version=${{ env.VERSION }}

      - name: list artifacts
        run: ls -la ./artifacts/

      - name: push to nuget.org
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "./artifacts/Packet.Ax25.Sdl.${VERSION}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate
          # Symbol package — best-effort. nuget.org's symbol server has
          # accepted .snupkg sibling packages alongside the main one
          # since ~2019; failure here shouldn't block the main publish.
          if [ -f "./artifacts/Packet.Ax25.Sdl.${VERSION}.snupkg" ]; then
            dotnet nuget push "./artifacts/Packet.Ax25.Sdl.${VERSION}.snupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${NUGET_API_KEY}" \
              --skip-duplicate || \
              echo "::warning::snupkg push failed; main nupkg still uploaded."
          fi

      - name: warn if NUGET_API_KEY missing
        if: env.NUGET_API_KEY == ''
        run: |
          echo "::warning::NUGET_API_KEY secret is not set — nuget push was skipped."
