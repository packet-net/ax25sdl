# Accepting a SABME puts the link into mod-128 operation with selective
# reject.
#
# §4.3.3.2: "The SABME command places two TNCs … in the asynchronous
# balanced mode (extended) connected state. In this mode … the modulus is
# 128."
#
# figc4.1 t14 draws "Set Version 2.2" as a processing box named after the
# figc4.7b subroutine; the interpreter reads it as that call for the version
# flag, the modulus and the reject mode (pinned semantic 9,
# packet-net/ax25sdl#123). k stays as configured: figc4.7b's k := 32 is not
# applied (6.7.1 makes k configurable), so this trace asserts the k it was
# seeded with. Until #123 the box set the flag only and this trace was a
# strict xfail on packethacking/ax25spec#54.
scenario: sabme-connect-applies-mod128
description: >
  Disconnected with default mod-8 configuration: accepting a SABME leaves
  the machine operating mod 128 with selective reject (prose §4.3.3.2,
  figc4.7b Set Version 2.2); k is left as configured.
citations:
  - "ax.25.2.2.4_Oct_25.md §4.3.3.2 (SABME Command)"
  - "ax.25.2.2.4_Oct_25.md §6.3.2 (Parameter Negotiation Phase)"
  - "figc4.1 t14, figc4.7b Set_Version_2_2"
initial:
  state: Disconnected
  variables: { modulo: 8, k: 4 }
steps:
  - name: accept SABME, the modulus becomes 128
    inject:
      event: SABME_received
      pf: true
      atoms: { able_to_establish: true }
    expect:
      state: Connected
      effects:
        - { frame: UA, command: false, pf: true }
        - { dl: DL_CONNECT_indication }
      variables: { version_2_2: true, modulo: 128, srej_enabled: true, k: 4 }
