# Link reset: SABM received while in Timer Recovery with unacknowledged data
# outstanding, the resetting procedure of §6.5, which §4.4.5.1 names as the
# other way out of the timer-recovery condition.
#
# Prose-derived expectations, written before figc4.5's SABM arm was read:
#   §6.3.3: "If the TNC receives a SABM(E) command while in the
#   information-transfer state, it follows the resetting procedure outlined
#   in Section 6.5." Timer Recovery is part of that state.
#   §6.5: "After receiving a SABM(E) frame from the previously connected
#   TNC, the receiver sends a UA frame back at the earliest opportunity,
#   sets its send and receive state variables V(S) and V(R) to 0 and stops
#   T1 ... Any busy condition that previously existed is also cleared." The
#   procedure "initializes both directions of data flow", which the figures
#   render as discarding the unacknowledged queue and re-indicating the
#   connection to layer 3 (figc4.4 t14 no; pinned by the passing
#   sabm-reset-in-connected-unacked trace).
#   §4.4.5.1: the timer-recovery condition is cleared "by the link being
#   reset", so the retry count that belongs to it is done with (RC=0, as
#   figc4.4's own reset arm does) and the machine is back in Connected.
#   §4.4.5.2 and §6.7.1.3: with T1 stopped and nothing outstanding, T3 is
#   what keeps the freshly reset link alive, so it must be running.
#   C4.3 error F: "Data link reset; i.e., SABM received in state 3, 4 or 5."
#
# EXPECTED FAILURE: figc4.5b's SABM(E) arm stops both T1 and T3, leaving the
# reset link with no keepalive until traffic flows, and does not reset RC,
# unlike the structurally identical figc4.4 t14 reset arm. Catalogued
# upstream as packethacking/ax25spec#53.
#
# The scenario deliberately has data outstanding (V(s) != V(a)). The other
# branch of the same arm, V(s) = V(a), diverges from §6.5 earlier and more
# broadly than #53 describes (as transcribed it neither stops T1 nor zeroes
# V(s)/V(a)/V(r)); that is recorded as a hypothesis in the PR that added
# this trace, not folded into this marker.
scenario: sabm-reset-in-timer-recovery
description: >
  Timer Recovery with I(ns=1..2) unacknowledged (V(s)=3, V(a)=1, RC=2, T1
  running, peer busy): SABM P=1 draws UA F=1, DL-ERROR Indication (F) and a
  fresh DL-CONNECT indication, discards the queue, zeroes V(s)/V(a)/V(r),
  clears the busy condition and the retry count, stops T1 and leaves T3
  running in Connected, exactly what the same reset does from Connected
  (sabm-reset-in-connected-unacked.trace.yaml).
citations:
  - "ax.25.2.2.4_Oct_25.md §6.5 (Resetting Procedure)"
  - "ax.25.2.2.4_Oct_25.md §6.3.3 (Information-Transfer Phase)"
  - "ax.25.2.2.4_Oct_25.md §4.4.5.1 (T1 Timer Recovery)"
  - "ax.25.2.2.4_Oct_25.md §4.4.5.2 (Timer T3 Recovery)"
  - "ax.25.2.2.4_Oct_25.md §6.7.1.3 (Inactive Link Timer T3)"
  - "ax.25.2.2.4_Oct_25.md Appendix C4.3 (error code F)"
  - "figc4.5 t13 (SABM_received, V(s) != V(a)) against figc4.4 t14"
expected_failure: https://github.com/packethacking/ax25spec/issues/53
initial:
  state: TimerRecovery
  variables: { modulo: 8, k: 4, vs: 3, va: 1, vr: 0, rc: 2, peer_receiver_busy: true }
  timers: { t1: running, t3: stopped }
steps:
  - name: peer resets the link with SABM while data is outstanding
    inject: { event: SABM_received, pf: true }
    expect:
      state: Connected
      effects:
        - { frame: UA, command: false, pf: true }
        - { dl: "DL-ERROR Indication (F)" }
        - { dl: DL_CONNECT_indication }
      variables:
        vs: 0
        va: 0
        vr: 0
        rc: 0
        peer_receiver_busy: false
      timers: { t1: stopped, t3: running }
      queue: []
