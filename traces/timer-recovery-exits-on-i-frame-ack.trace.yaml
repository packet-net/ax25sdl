# Timer Recovery exit when the clearing acknowledgement arrives on an
# I frame rather than on a supervisory response.
#
# Prose-derived expectations, written before figc4.5's I_received arms were
# read:
#   §4.4.5.1: the T1 timer-recovery condition "is cleared by the reception
#   of an acknowledgement for the sent frame(s), or by the link being
#   reset". Nothing restricts the carrier of that acknowledgement to a
#   supervisory response.
#   §6.4.6: "Whenever an I or S frame is correctly received ... the N(R) of
#   the received frame is checked to see if it includes an acknowledgement
#   of outstanding sent I frames. The T1 timer is canceled if the received
#   frame actually acknowledges previously unacknowledged frames." Nothing
#   remains outstanding afterwards, so T1 is not started again.
#   §4.4.5.2 and §6.7.1.3: "When T1 is not running (no outstanding I
#   frames), T3 periodically causes the TNC to poll the other TNC"; "When T3
#   times out, an RR or RNR frame is transmitted as a command with the P bit
#   set, and then T1 is started."
#   §6.4.2.1: the in-sequence I frame is accepted and V(r) incremented.
#   §6.4.11: N2 counts the attempts "to get a supervisory response frame
#   with the F bit set" within one waiting-acknowledgement episode. The
#   episode ends when the condition clears, so its retry count is done
#   with; the figure's own F=1 exits (figc4.5 t18/t19/t23 yes/yes/yes) zero
#   RC on the way back to Connected, and the I-frame carrier must do the
#   same or the count creeps across unrelated recoveries.
#
# EXPECTED FAILURE: figc4.5 leaves Timer Recovery only on a supervisory
# response with F=1 whose N(R) = V(s), or on a link reset. Its in-sequence
# I_received arms run Check_I_Frame_Acknowledged (V(a) := N(r), Stop T1,
# Start T3) and return to Timer Recovery, and the page has no T3_expiry arm,
# so the station is stranded with its keepalive dead and RC uncleared.
# Reproduced on air on 2026-09-10 (M0LTE to GB7RDG, packethacking/ax25spec
# docs/evidence/h1-timer-recovery-2026-09-10). Catalogued upstream as
# packethacking/ax25spec#91.
scenario: timer-recovery-exits-on-i-frame-ack
description: >
  Timer Recovery with I(ns=0) outstanding (V(s)=1, V(a)=0, RC=1, T1 running
  after the §6.4.11 poll): the peer's I(ns=0, nr=1, P=0) carries the
  acknowledgement that clears the window. The condition clears (§4.4.5.1):
  V(a)=1, T1 stopped with nothing outstanding (§6.4.6), T3 running
  (§4.4.5.2), RC back to 0, state Connected. The keepalive then fires and
  polls (§4.4.5.2), which the figure as drawn can never do from Timer
  Recovery because the page has no T3_expiry arm.
citations:
  - "ax.25.2.2.4_Oct_25.md §4.4.5.1 (T1 Timer Recovery)"
  - "ax.25.2.2.4_Oct_25.md §6.4.6 (Receiving Acknowledgement)"
  - "ax.25.2.2.4_Oct_25.md §4.4.5.2 (Timer T3 Recovery)"
  - "ax.25.2.2.4_Oct_25.md §6.7.1.3 (Inactive Link Timer T3)"
  - "ax.25.2.2.4_Oct_25.md §6.4.2.1 (Receiving I Frames, Not Busy)"
  - "ax.25.2.2.4_Oct_25.md §6.4.11 (Waiting Acknowledgement)"
  - "figc4.5 t22 (I_received, in sequence); figc4.4 t13 (T3_expiry)"
  - "packethacking/ax25spec docs/evidence/h1-timer-recovery-2026-09-10/h1-drop.log"
expected_failure: https://github.com/packethacking/ax25spec/issues/91
initial:
  state: TimerRecovery
  variables: { modulo: 8, k: 4, vs: 1, va: 0, vr: 0, rc: 1 }
  timers: { t1: running, t3: stopped }
steps:
  - name: the clearing acknowledgement arrives on the peer's I frame
    inject: { event: I_received, command: true, pf: false, ns: 0, nr: 1, data: d0 }
    expect:
      # Effects deliberately unasserted: §6.4.2.1 leaves the station free to
      # choose how, and after what delay, it acknowledges the received
      # frame. The defect under test is the state, the timers and RC.
      state: Connected
      variables: { va: 1, vr: 1, rc: 0 }
      timers: { t1: stopped, t3: running }

  - name: the keepalive fires and polls the peer
    inject: { event: T3_expiry }
    expect:
      # §4.4.5.2: "When T3 times out, an RR or RNR frame is transmitted as a
      # command with the P bit set, and then T1 is started." §6.4.11: the
      # poll is awaited in the waiting-acknowledgement condition.
      state: TimerRecovery
      effects:
        - { frame: RR, command: true, pf: true, nr: 1 }
      timers: { t1: running }
